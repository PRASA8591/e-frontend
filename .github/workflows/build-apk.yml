name: Build & Release Android APK (ExpenseTracker Pro)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ExpenseTrackerPro.apk

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Pro-APK
          path: android/app/build/outputs/apk/debug/ExpenseTrackerPro.apk

      - name: Publish Direct APK to GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ExpenseTracker Pro (Latest APK)"
          body: |
            ## 📱 ExpenseTracker Pro - Android APK Direct Download

            Direct APK download for mobile:
            - Tap **`ExpenseTrackerPro.apk`** below to download directly onto your Android device.
            - Open the downloaded APK to install or update ExpenseTracker Pro.
            - No desktop mode or zip extraction required!

            *Built automatically by GitHub Actions from `${{ github.ref_name }}` (${{ github.sha }}).*
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/ExpenseTrackerPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
